# Tarquin primitives — Foundry build config.
# `forge build` / `forge test` from this dir (or `--root primitives`). Solidity pinned to 0.8.28.

[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200

# Determinism discipline (dual-target parity with the off-chain engine):
# - no block.timestamp-driven branching in primitive logic without an explicit,
#   parity-tested justification;
# - no external inference calls of any kind.

# Generated files (tarquin-engine-gen) are canonical as emitted; formatting them would
# break the IR drift check (`tarquin-engine-gen --check`).
[fmt]
ignore = ["./src/generated/**/*.sol", "./test/generated/**/*.sol"]
